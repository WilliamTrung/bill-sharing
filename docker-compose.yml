# Public (MSI): http://bill-sharing.williamthanhtrung.id.vn (global-nginx -> bill-sharing-app:8080)
name: bill-sharing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bills}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bills}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bills} -d ${POSTGRES_DB:-bills}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bill-sharing-app:local
    container_name: bill-sharing-app
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/deploy.env.example}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-bills}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bills}?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      UPLOAD_DIR: /data/uploads
      WEB_DIR: /app/web
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      CURRENCY: ${CURRENCY:-$$}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  uploads:

networks:
  proxy-net:
    external: true
