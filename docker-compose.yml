# Public (MSI): http://bill-sharing.williamthanhtrung.id.vn (global-nginx -> bill-sharing-app:8080)
# Postgres: shared-postgres on db-net (see deploy/msi-init-db.sh)
#
# All configuration and secrets live in the deploy env file (env_file below);
# nothing deployment-specific is hard-coded here. See deploy/deploy.env.example
# for the full list of variables the app reads.
name: bill-sharing

services:
  app:
    build: .
    image: bill-sharing-app:local
    container_name: bill-sharing-app
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/deploy.env.example}
    environment:
      # Container-internal paths only; everything else comes from env_file.
      PORT: "8080"
      UPLOAD_DIR: /data/uploads
      WEB_DIR: /app/web
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    networks:
      - proxy-net
      - db-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  uploads:

networks:
  proxy-net:
    external: true
  db-net:
    external: true
