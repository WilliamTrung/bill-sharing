# Public (MSI): http://bill-sharing.williamthanhtrung.id.vn (global-nginx -> bill-sharing-app:8080)
# Postgres: shared-postgres on db-net (see deploy/msi-init-db.sh)
name: bill-sharing

services:
  app:
    build: .
    image: bill-sharing-app:local
    container_name: bill-sharing-app
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-deploy/deploy.env.example}
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_EMAIL: ${SEED_EMAIL:?SEED_EMAIL is required}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      UPLOAD_DIR: /data/uploads
      WEB_DIR: /app/web
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      CURRENCY: ${CURRENCY:-$$}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    networks:
      - proxy-net
      - db-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  uploads:

networks:
  proxy-net:
    external: true
  db-net:
    external: true