# bill-sharing on MSI (proxy-net). TLS at Cloudflare edge.
# Install: /home/msi/infra/nginx/conf.d/bill-sharing.conf
# Reload: docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload

# Hop-by-hop headers for WebSocket upgrades (used by /api/ws below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bill-sharing.williamthanhtrung.id.vn;

    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Long-lived realtime event stream. Needs the Upgrade/Connection pass-through
    # and a read timeout well beyond the app's 30s ping interval.
    location = /api/ws {
        set $bill_sharing_app bill-sharing-app;
        proxy_pass http://$bill_sharing_app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        set $bill_sharing_app bill-sharing-app;
        proxy_pass http://$bill_sharing_app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}