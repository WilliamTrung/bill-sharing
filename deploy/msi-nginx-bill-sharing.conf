# bill-sharing on MSI (proxy-net). TLS at Cloudflare edge.
# Install: /home/msi/infra/nginx/conf.d/bill-sharing.conf
# Reload: docker exec global-nginx nginx -t && docker exec global-nginx nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name bill-sharing.williamthanhtrung.id.vn;

    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $bill_sharing_app bill-sharing-app;
        proxy_pass http://$bill_sharing_app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}