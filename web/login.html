<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title data-i18n="login.docTitle">Sign in · Bill Sharing</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="login-wrap">
      <div class="login-card">
        <div class="spread">
          <span class="brand" data-i18n="app.name">Bill Sharing</span>
          <div data-lang-switcher></div>
        </div>
        <h1 data-i18n="login.heading">Admin sign in</h1>
        <p class="sub" data-i18n="login.sub">Enter the admin password to manage members, groups and bills.</p>

        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="password" data-i18n="login.password">Admin password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              autofocus
            />
          </div>
          <div class="notice error hidden" id="login-error" role="alert"></div>
          <button class="btn btn-block" type="submit" id="login-submit" data-i18n="login.submit">Sign in</button>
        </form>
      </div>
    </main>

    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
