<!DOCTYPE html>
<html lang="en">
  <head>

    <title data-i18n="home.docTitle">Bill Sharing</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>

      <div class="login-card">
        <div class="spread">
